services:
  postgres:
    image: postgres:16-alpine
    container_name: linksy_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: linksy
      POSTGRES_PASSWORD: linksy123
      POSTGRES_DB: linksy
    ports:
      - "5432:5432"
    volumes:
      - linksy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linksy -d linksy"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis — rate-limit (multi-instance), BullMQ email queue, pub/sub buses
  # (notifications, presence, messages, typing, inbox, call-signal), entity cache.
  # Without this, the app falls back to in-process memory and does not scale horizontally.
  redis:
    image: redis:7-alpine
    container_name: linksy_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - linksy_redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: linksy_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://linksy:linksy123@postgres:5432/linksy
      # In-container broker (ignore host .env REDIS_URL=localhost when using compose).
      REDIS_URL: ${COMPOSE_REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-in-dotenv}
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # Queue outbound mail through BullMQ when Redis is available (worker service below).
      EMAIL_QUEUE_ENABLED: ${EMAIL_QUEUE_ENABLED:-1}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Drains BullMQ email jobs (see scripts/email-worker.ts). Needs same REDIS_URL + mail env as app.
  email-worker:
    build:
      context: .
      dockerfile: Dockerfile.email-worker
    container_name: linksy_email_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://linksy:linksy123@postgres:5432/linksy
      # In-container broker (ignore host .env REDIS_URL=localhost when using compose).
      REDIS_URL: ${COMPOSE_REDIS_URL:-redis://redis:6379}
      EMAIL_QUEUE_ENABLED: "1"
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_WORKER_CONCURRENCY: ${EMAIL_WORKER_CONCURRENCY:-5}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Optional — TURN server for WebRTC voice/video calls behind NAT.
  # `--use-auth-secret` matches the HMAC-SHA1 username scheme `/api/calls/ice-servers`
  # signs when `TURN_STATIC_AUTH_SECRET` is set. Make sure the same secret is
  # exported in your shell / `.env` so the app and coturn agree.
  # Local clients should hit `turn:127.0.0.1:3478`; configure `TURN_URL` accordingly.
  coturn:
    image: coturn/coturn:4.6
    container_name: linksy_turn
    restart: unless-stopped
    network_mode: host
    command:
      - --listening-port=3478
      - --tls-listening-port=5349
      - --min-port=49160
      - --max-port=49200
      - --realm=linksy.local
      - --use-auth-secret
      - --static-auth-secret=${TURN_STATIC_AUTH_SECRET:-change-me}
      - --fingerprint
      - --lt-cred-mech
      - --no-cli
      - --no-tlsv1
      - --no-tlsv1_1

volumes:
  linksy_pgdata:
  linksy_redisdata:
