name: Keep Neon compute warm

# Vercel Hobby only allows daily crons, so the every-5-minute ping that
# stops Neon Free's compute from auto-suspending lives in GitHub Actions
# instead. Cheapest possible request — a single SELECT 1 over the pooler.
on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (GH may delay a few min under load)
  workflow_dispatch:         # allow manual ping from the Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Hit /api/keep-warm
        run: |
          curl -sSf -o /dev/null -w "status=%{http_code} total=%{time_total}s\n" \
            https://linksy-pied.vercel.app/api/keep-warm
