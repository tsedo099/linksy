apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

commonLabels:
  app.kubernetes.io/name: linksy
  app.kubernetes.io/part-of: linksy

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - configmap.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - cronjob-pg-backup.yaml
  # secret.example.yaml is intentionally excluded — overlays bring their own
  # secret manifest (or SealedSecret / ExternalSecret).
