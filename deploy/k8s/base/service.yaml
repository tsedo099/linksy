apiVersion: v1
kind: Service
metadata:
  name: linksy-web
  labels:
    app.kubernetes.io/name: linksy
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: linksy
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  # Keep affinity off — SSE clients reconnect, so sticky sessions add no
  # value and just imbalance load on rollouts.
  sessionAffinity: None
