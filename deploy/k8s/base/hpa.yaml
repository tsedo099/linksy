apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: linksy-web
  labels:
    app.kubernetes.io/name: linksy
    app.kubernetes.io/component: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: linksy-web
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    # Aggressive scale-up: a viral post can 10x request rate inside a minute.
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
    # Conservative scale-down: SSE connections cost us nothing to keep open
    # but cost users a reconnect when the pod they're attached to dies.
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
