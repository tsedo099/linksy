# EXAMPLE ONLY — DO NOT COMMIT REAL SECRETS.
#
# In production, use one of:
#   - SealedSecrets (bitnami-labs/sealed-secrets)
#   - External Secrets Operator (AWS Secrets Manager / GCP Secret Manager / Vault)
#   - Sops-encrypted manifests + age key
#
# This file documents the shape of the Secret. Replace placeholders, then
# either `kubeseal` it before committing or apply manually from a private vault.

apiVersion: v1
kind: Secret
metadata:
  name: linksy-secrets
  labels:
    app.kubernetes.io/name: linksy
type: Opaque
stringData:
  # --- DB / cache ---
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/linksy?sslmode=require"
  REDIS_URL: "rediss://default:PASSWORD@HOST:6380"

  # --- Auth ---
  SESSION_SECRET: "REPLACE_WITH_32B_RANDOM"        # >= 32 bytes, rotate quarterly
  JWT_SIGNING_SECRET: "REPLACE_WITH_32B_RANDOM"
  WEBAUTHN_RP_ID: "linksy.example.com"

  # --- Storage ---
  S3_ENDPOINT: "https://s3.eu-central-1.amazonaws.com"
  S3_REGION: "eu-central-1"
  S3_BUCKET: "linksy-prod-media"
  S3_ACCESS_KEY_ID: "REPLACE"
  S3_SECRET_ACCESS_KEY: "REPLACE"
  VERCEL_BLOB_READ_WRITE_TOKEN: "REPLACE"

  # --- Email ---
  RESEND_API_KEY: "REPLACE"

  # --- Push ---
  WEB_PUSH_VAPID_PUBLIC_KEY: "REPLACE"
  WEB_PUSH_VAPID_PRIVATE_KEY: "REPLACE"
  FCM_SERVER_KEY: "REPLACE"
  APNS_KEY_ID: "REPLACE"
  APNS_TEAM_ID: "REPLACE"
  APNS_PRIVATE_KEY: "REPLACE"

  # --- Stripe ---
  STRIPE_SECRET_KEY: "sk_live_REPLACE"
  STRIPE_WEBHOOK_SECRET: "whsec_REPLACE"

  # --- Observability ---
  SENTRY_DSN: "https://REPLACE@oXXXX.ingest.sentry.io/XXXX"
