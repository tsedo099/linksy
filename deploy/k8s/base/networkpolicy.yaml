apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: linksy-web
  labels:
    app.kubernetes.io/name: linksy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: linksy
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the ingress controller and Prometheus may talk to the web pods.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # DNS — required for any external lookup.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL inside the cluster.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Redis inside the cluster.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    # HTTPS — Stripe, Resend, S3, FCM, APNs, Sentry, OAuth providers.
    # The web pod is a client of many SaaS APIs; locking down by IP CIDR is
    # impractical, so we just allow outbound :443.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 587   # SMTP submission (some providers)
        - protocol: TCP
          port: 465   # SMTPS
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: linksy-default-deny
  labels:
    app.kubernetes.io/name: linksy
spec:
  # Catch-all deny for the namespace. Above policies are additive.
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
