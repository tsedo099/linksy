apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linksy-web
  labels:
    app.kubernetes.io/name: linksy
    app.kubernetes.io/component: web
  annotations:
    # SSE + WebRTC signalling — disable proxy buffering so events flush
    # immediately and keep idle connections alive longer than the default 60s.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # 10MB upload ceiling — matches the route handler's limit.
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # cert-manager will mint + renew. Override the issuer per-overlay.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - linksy.example.com
      secretName: linksy-tls
  rules:
    - host: linksy.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: linksy-web
                port:
                  number: 80
