apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: linksy-dev
nameSuffix: -dev

resources:
  - ../../base

# Smaller footprint for dev: 1 replica, lower resource floor, HPA off.
patches:
  - target:
      kind: Deployment
      name: linksy-web
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
  - target:
      kind: HorizontalPodAutoscaler
      name: linksy-web
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      kind: Ingress
      name: linksy-web
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: dev.linksy.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: dev.linksy.example.com
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-staging

configMapGenerator:
  - name: linksy-config
    behavior: merge
    literals:
      - NEXT_PUBLIC_SITE_URL=https://dev.linksy.example.com
      - SENTRY_ENVIRONMENT=development
      - STRIPE_LIVE_MODE=false
      - LOG_LEVEL=debug
